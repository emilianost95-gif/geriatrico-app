# Compila el APK firmado de Android.
# - Cada push a "main" genera un APK descargable en la pestaña Actions (sección "Artifacts").
# - Cada tag "v*" (ej. v1.0.1) además crea un Release con el APK adjunto.
# Requiere 4 secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: APK Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Revisar que estén los secrets de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          faltan=""
          [ -z "$KEYSTORE_BASE64" ] && faltan="$faltan ANDROID_KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && faltan="$faltan ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && faltan="$faltan ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && faltan="$faltan ANDROID_KEY_PASSWORD"
          if [ -n "$faltan" ]; then
            echo "::error title=Faltan secrets de firma::Cargalos en Settings → Secrets and variables → Actions:$faltan"
            exit 1
          fi

      - name: Instalar Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: npm test

      - name: Compilar la web y copiarla a Android
        run: npm run build:android

      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v5

      - name: Datos de versión y firma
        id: version
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/registro-geriatrico.jks"
          version=$(node -p "require('./package.json').version")
          # En un tag v1.2.3 se usa ese número; si no, el de package.json
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "nombre=$version" >> "$GITHUB_OUTPUT"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/registro-geriatrico.jks" >> "$GITHUB_ENV"

      - name: Compilar APK firmado
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Siempre creciente: así Android acepta la actualización sin desinstalar
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.version.outputs.nombre }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verificar firma y renombrar
        id: apk
        run: |
          origen=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$origen" ]; then
            echo "::error::No se generó el APK firmado (¿contraseña o alias incorrectos?)"
            ls -R android/app/build/outputs/apk || true
            exit 1
          fi
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$origen" | head -5
          nombre="registro-geriatrico-${{ steps.version.outputs.nombre }}-${{ github.run_number }}.apk"
          mkdir -p salida
          cp "$origen" "salida/$nombre"
          echo "archivo=salida/$nombre" >> "$GITHUB_OUTPUT"
          rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Guardar el APK en Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: registro-geriatrico-apk
          path: ${{ steps.apk.outputs.archivo }}
          retention-days: 30

      - name: Publicar Release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.archivo }}
          generate_release_notes: true
